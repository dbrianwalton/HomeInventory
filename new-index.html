<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="btm-inventory.css">

  <!-- Google OAuth -->
  <script src="https://accounts.google.com/gsi/client"></script>

  <!-- Your API interface file -->
  <script src="btm-inventory-data-api.js"></script>

  <!-- QR scanner + generator -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body { font-family: sans-serif; padding: 1rem; }
    #cameraButton {
      position: fixed;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
    }
    .card { margin-bottom: 1rem; }
  </style>
</head>

<body>

  <h1 id="app-title">Inventory</h1>

  <button id="cameraButton" onclick="startScanner()">📷</button>
  <button id="labelButton" onclick="openLabelPanel()">🏷️</button>
  <div class="mode-wrapper">
    <button id="modeButton" onclick="toggleMode()">🔍</button>
    <div id="selectionCount"></div>
  </div>

  <div class="card nav-tabs">
    <button onclick="showInventory()">Inventory</button>
    <button onclick="showStorage()">Storage</button>
    <button onclick="showEvents()">Events</button>
  </div>

  <div id="status" class="card">
    <div id="status-controls"></div>
    <div id="status-controls-chips"></div>
    <div id="status-message"></div>
  </div>

  <div id="content"></div>

  <div id="scanner-panel" style="display:none;">
    <div id="qr-reader"></div>
    <button onclick="stopScanner()">Close Scanner</button>
  </div>

  <div id="labelPanel" class="label-panel hidden">

    <div class="label-panel-content">

      <h3>Print Labels</h3>

      <!-- Format -->
      <label>Label Format</label>
      <select id="labelFormat">
        <option value="2x4-10">2" x 4" (10 per page)</option>
      </select>

      <!-- Layout picker -->
      <label>Start Position</label>
      <div id="labelGrid" class="label-grid"></div>

      <!-- Buttons -->
      <div class="label-actions">
        <button onclick="confirmLabelPrint()">Create PDF</button>
        <button onclick="closeLabelPanel()">Cancel</button>
      </div>

    </div>
  </div>

<script>
/* ---------- APP STATE ---------- */

let activeTab = "inventory";
const appID = "BTM-Inventory";
const qrVersion = "1.0";

let currentView = "inventory"; // "inventory" | "item"
let interactionMode = "browse";  // "browse" | "select"
let itemMode = "view"; // "view" | "edit"

let originalItem = null;
let currentItem = null;
let isDirty = false;

let isDragging = false;
let didDrag = false;
let dragAction = null;  // "add" | "remove" | null

let inventorySort = {
  field: 'Date',
  direction: 'desc'
};

let inventoryFilter = {
  text: '',
  dateFrom: null,
  dateTo: null
};

let filtersExpanded = false;
let selectedItems = new Set();
let labelStartIndex = 0;

/* ---------- INIT ---------- */

window.onload = async () => {
  await initAuth();  // OAuth from external JS
  await loadAllData();
  renderHome();
};

/* ---------- NAV ---------- */

function showInventory() {
  activeTab = 'inventory';
  currentView = "inventory";

  document.getElementById("modeButton").style.display = "block";
  
  updateModeButton();
  renderHome();
}

function showEvents() {
  activeTab = 'events';
  renderEventList();
}

function showStorage() {
  activeTab = 'storage';
  renderStorageList();
}

/* ---------- HOME ---------- */

function renderHome() {
  document.getElementById('status-message').innerHTML = "Loading...";
  loadInventory().then(() => {
    document.getElementById('status-message').innerHTML = "";
    renderInventory();
  });
}

/* ---------- INVENTORY ---------- */

function renderInventory() {
  renderFilterUI();
  renderFoodInstanceList();
}

function renderFoodInstanceList() {
  let working = window._foodInstanceCache || [];
  const storageMap = window._storageMap || {};

  // ---- TEXT FILTER ----
  if (inventoryFilter.text) {
    const terms = inventoryFilter.text.split(/\s+/);

    working = working.filter(i => {
      const location = storageMap[i.StorageLocationID];
      const haystack = [
        i.Label,
        i.Keywords,
        i.Notes,
        location?.Label || '',
        i.FoodType,
        i.FoodClassification
      ]
        .filter(Boolean)
        .join(' ')
        .toLowerCase()
        .replace(/\s+/g, ' ');

      return terms.every(t => haystack.includes(t));
    });
  }

  // ---- DATE FILTER ----
  if (inventoryFilter.dateFrom || inventoryFilter.dateTo) {
    working = working.filter(i => {
      if (!i.Date) return false;

      const d = parseDate(i.Date);
      if (inventoryFilter.dateFrom && d < inventoryFilter.dateFrom) return false;
      if (inventoryFilter.dateTo && d > inventoryFilter.dateTo) return false;

      return true;
    });
  }

  const sorted = [...working].sort((a, b) => {
    const at = a.Date ? parseDate(a.Date) : 0;
    const bt = b.Date ? parseDate(b.Date) : 0;
    return inventorySort.direction === 'asc' ? at - bt : bt - at;
  });

  let html = '<div class="card"><div class="table-wrapper"><table class="inventory-table">';

  html += `<thead>
    <tr>
      <th onclick="toggleSort()">
        Date ${inventorySort.direction === 'asc' ? '▲' : '▼'}
      </th>
      <th>ID</th>
      <th>Description</th>
      <th>Storage</th>
      <th>Status</th>
    </tr>
  </thead><tbody>`;

  sorted.forEach(i => {
    const location = storageMap[i.StorageLocationID];
    html += `
      <tr
        id="row-${i.InstanceID}"
        data-id="${i.InstanceID}"
        class="${selectedItems.has(i.InstanceID) ? 'selected-row' : ''}"
        onmousedown="handleRowMouseDown(event, this)"
        onmouseover="handleRowMouseOver(event, this)"
        onclick="handleRowClick(event, '${i.InstanceID}')"
        ontouchstart="handleTouchStart(event)"
        ontouchmove="handleTouchMove(event)"
        ontouchend="handleTouchEnd(event)"
      >
        <td>${i.Date || ''}</td>
        <td>${i.InstanceID}</td>
        <td>${i.Label}</td>
        <td>${location?.Label || ''}</td>
        <td>${i.Status}</td>
      </tr>`;
  });

  html += '</tbody></table></div></div>';
  document.getElementById('content').innerHTML = html;
}

/* ---------- DETAIL ---------- */

function showFoodInstance(id) {
  currentView = "item";

  document.getElementById("modeButton").style.display = "block";

  const item = window._foodInstanceCache.find(i => i.InstanceID === id);
  if (!item) return;

  originalItem = item;
  currentItem = { ...item };
  itemMode = "view";

  updateModeButton();
  renderFoodInstanceDetail();
}

function renderFoodInstanceDetail() {
  const item = currentItem;
  const storage = window._storageMap[item.StorageLocationID];

  const readOnly = itemMode === "view" ? "readonly" : "";

  const storageText = storage
    ? `${storage.Label} (${storage.PhysicalLocation})`
    : "Unassigned";

  let html = `
    <div class="card ${itemMode === "edit" ? "edit-mode" : "view-mode"}">

      <h2>${item.InstanceID}</h2>

      <!-- Storage Location -->
      <div class="field-row">
        <label>Storage Location</label>
        ${
          itemMode === "view"
            ? `<button onclick="showStorageLocation('${item.StorageLocationID}')">
                ${storageText}
              </button>`
            : `<select id="fld-storageLocation">
                ${(window._storageLocationCache || []).map(s => `
                  <option value="${s.StorageLocationID}"
                    ${s.StorageLocationID === item.StorageLocationID ? "selected" : ""}>
                    ${s.Label} (${s.PhysicalLocation})
                  </option>
                `).join('')}
                ${itemMode === "edit" ? 'oninput="markDirty()"' : ''}
              </select>`
        }
      </div>

      <!-- Label -->
      <div class="field-row">
        <label>Label</label>
        <input id="fld-label" value="${item.Label || ''}" ${readOnly} 
        ${itemMode === "edit" ? 'oninput="markDirty()"' : ''}
      />
      </div>

      <!-- Keywords -->
      <div class="field-row">
        <label>Keywords</label>
        <input id="fld-keywords" value="${item.Keywords || ''}" ${readOnly} 
        ${itemMode === "edit" ? 'oninput="markDirty()"' : ''}
      />
      </div>

      <!-- Notes -->
      <div class="field-row">
        <label>Notes</label>
        <input id="fld-notes" value="${item.Notes || ''}" ${readOnly} 
        ${itemMode === "edit" ? 'oninput="markDirty()"' : ''}
      />
      </div>

      <!-- Size -->
      <div class="field-row">
        <label>Size</label>
        <input id="fld-size" value="${item.Size || ''}" ${readOnly} 
        ${itemMode === "edit" ? 'oninput="markDirty()"' : ''}
      />
      </div>

      <!-- Storage Type -->
      <div class="field-row">
        <label>Storage Type</label>
        ${
          itemMode === "view"
            ? `<div>${item.StorageType || ''}</div>`
            : `<select id="fld-storageType">
                ${["Freeze-Dried","Frozen","Bottled","Canned","Boxed","Other"]
                  .map(opt => `
                    <option ${item.StorageType === opt ? "selected" : ""}>
                      ${opt}
                    </option>
                  `).join('')}
                ${itemMode === "edit" ? 'oninput="markDirty()"' : ''}
              </select>`
        }
      </div>

      <div style="margin-top: 1rem;">
        ${
          itemMode === "view"
            ? `
              <button onclick="enterEditMode()">Edit</button>
              <button onclick="showInventory()">Back</button>
            `
            : `
              <button onclick="saveItem()">Save</button>
              <button onclick="cancelEdit()">Cancel</button>
            `
        }
      </div>

    </div>
  `;

  document.getElementById("content").innerHTML = html;
}

function getChangedFields(original, updated) {
  const changes = {};

  Object.keys(updated).forEach(key => {
    if (updated[key] !== original[key]) {
      changes[key] = updated[key];
    }
  });

  return changes;
}

function markDirty() {
  isDirty = true;
  document.getElementById("modeButton")?.classList.add("dirty");
}

function clearDirty() {
  isDirty = false;
  document.getElementById("modeButton")?.classList.remove("dirty");
}

function enterEditMode() {
  itemMode = "edit";
  clearDirty();
  renderFoodInstanceDetail();
}

function cancelEdit() {
  itemMode = "view";
  clearDirty(); 

  // ✅ reload original
  const original = window._foodInstanceCache.find(i => i.InstanceID === currentItem.InstanceID);
  currentItem = { ...original };

  renderFoodInstanceDetail();
}

async function saveItem() {

  currentItem.Label = document.getElementById("fld-label").value;
  currentItem.Keywords = document.getElementById("fld-keywords").value;
  currentItem.Notes = document.getElementById("fld-notes").value;
  currentItem.Size = document.getElementById("fld-size").value;

  currentItem.StorageType =
    document.getElementById("fld-storageType")?.value || currentItem.StorageType;

  currentItem.StorageLocationID =
    document.getElementById("fld-storageLocation")?.value || currentItem.StorageLocationID;

  const changes = getChangedFields(originalItem, currentItem);

  if (!Object.keys(changes).length) {
    alert("No changes to save");
    return;
  }

  try {
    await updateFoodInstance(currentItem.InstanceID, changes);

    // ✅ update local cache to reflect changes
    const idx = window._foodInstanceCache.findIndex(
      i => i.InstanceID === currentItem.InstanceID
    );
    if (idx !== -1) {
      window._foodInstanceCache[idx] = { ...currentItem };
    }

    isDirty = false;

    alert("Saved!");

    itemMode = "view";
    renderFoodInstanceDetail();

  } catch (err) {
    console.error(err);
    alert("Error saving data");
  }
}

function showSavePreview(data) {
  const div = document.createElement("div");

  div.style.position = "fixed";
  div.style.top = "20px";
  div.style.left = "50%";
  div.style.transform = "translateX(-50%)";
  div.style.background = "white";
  div.style.border = "1px solid #ccc";
  div.style.padding = "10px";
  div.style.zIndex = "2000";

  div.innerHTML = `
    <strong>Would save:</strong><br/>
    <pre>${JSON.stringify(data, null, 2)}</pre>
    <button onclick="this.parentElement.remove()">Close</button>
  `;

  document.body.appendChild(div);
}

/* ---------- STORAGE ---------- */

function renderStorageList() {
  const storage = window._storageLocationCache;

  let html = '<div class="card"><table class="inventory-table"><tbody>';

  storage.forEach(s => {
    html += `
      <tr onclick="showStorageLocation('${s.StorageLocationID}')">
        <td>${s.StorageLocationID}</td>
        <td>${s.Label}</td>
        <td>${s.PhysicalLocation}</td>
      </tr>`;
  });

  html += '</tbody></table></div>';
  document.getElementById('content').innerHTML = html;
}

function showStorageLocation(id) {
  document.getElementById('status-message').innerHTML =
    '<div><em>Loading location…</em></div>';

  const location = window._storageMap[id];

  if (!location) {
    showError({ message: "Location not found" });
    return;
  }

  // ✅ Build related food instances from cache
  const foodInstances = window._foodInstanceCache.filter(
    f => f.StorageLocationID === id
  );

  // ✅ Render using same structure as API
  renderStorageLocation({
    storageLocation: location,
    foodInstances: foodInstances
  });

  document.getElementById('status-message').innerHTML = '';
}

function renderStorageLocation(data) {
  const s = data.storageLocation;

  let html = `<div class="card">
    <h2>${s?.Label}</h2>
  `;

  html += `
    <div class="card">
      <button id="qr-btn-${s.StorageLocationID}"
              onclick="toggleQRCode('storageLocation','${s.StorageLocationID}')">
        Show QR Code
      </button>
      <div id="qr-code-${s.StorageLocationID}" style="margin-top:10px;"></div>
    </div>
  `;

  html += `
    <button onclick="enterAssignmentMode('${s.StorageLocationID}')">
      Start Assigning Here
    </button>
  `;

  html += `<div class="card">`;

  data.foodInstances.forEach(f => {
    html += `<div>${f.InstanceID} - ${f.Label}</div>`;
  });

  html += `</div></div>`;

  document.getElementById('content').innerHTML = html;
}


/* ---------- QR ---------- */

function toggleQRCode(id) {
  const el = document.getElementById(`qr-code-${id}`);

  if (el.innerHTML) {
    el.innerHTML = "";
    return;
  }

  new QRCode(el, {
    text: JSON.stringify({ appID, id }),
    width: 200,
    height: 200
  });
}

/* ---------- SCANNER ---------- */

let qrScanner = null;

function startScanner() {
  document.getElementById('scanner-panel').style.display = 'block';

  qrScanner = new Html5Qrcode("qr-reader");

  qrScanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (text) => {
      handleQRCode(text);
      stopScanner();
    }
  );
}

function stopScanner() {
  if (!qrScanner) return;
  qrScanner.stop();
  qrScanner = null;
  document.getElementById('scanner-panel').style.display = 'none';
}

/* ---------- QR HANDLER ---------- */

function handleQRCode(text) {
  try {
    const obj = JSON.parse(text);
    if (obj.id) showFoodInstance(obj.id);
  } catch {
    alert("Invalid QR code");
  }
}

/* ---------- FILTERING ------------ */
function applyFilter() {
  const input = document.getElementById('filterInput');
  inventoryFilter.text = input ? input.value.trim().toLowerCase() : '';
  renderFoodInstanceList();
}

function clearTextFilter() {
  inventoryFilter.text = '';
  document.getElementById('filterInput').value = '';
  renderFoodInstanceList();
}

function applyDateFilter() {
  const from = document.getElementById('dateFrom');
  const to = document.getElementById('dateTo');

  inventoryFilter.dateFrom = from?.value
    ? new Date(from.value + 'T00:00:00').getTime()
    : null;

  inventoryFilter.dateTo = to?.value
    ? new Date(to.value + 'T23:59:59').getTime()
    : null;

  renderFoodInstanceList();
}

function clearDateFilter() {
  inventoryFilter.dateFrom = null;
  inventoryFilter.dateTo = null;

  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';

  renderFoodInstanceList();
}

function renderFilterUI() {
  document.getElementById('status-controls').innerHTML = `
    <div class="filters-header-row">
      <button
        class="filters-toggle"
        onclick="toggleFilters()"
        aria-expanded="${filtersExpanded}"
      >
        ${filtersExpanded ? '▾ Filters' : '▸ Filters'}
      </button>

      <input
        id="filterInput"
        type="text"
        placeholder="Filter by description or keywords"
        value="${inventoryFilter.text || ''}"
        oninput="applyFilter()"
      />

      <button onclick="clearTextFilter()">X</button>
    </div>

    <div id="filters-panel"
        class="filters-panel ${filtersExpanded ? '' : 'hidden'}">

      <div class="filter-row">
        <span class="filter-label">Date:</span>
        <input type="date" id="dateFrom" onchange="applyDateFilter()" />
        <span class="date-range-sep">–</span>
        <input type="date" id="dateTo" onchange="applyDateFilter()" />
      </div>

    </div>
  `;
}

function toggleFilters() {
  filtersExpanded = !filtersExpanded;

  const panel = document.getElementById('filters-panel');
  const button = document.querySelector('.filters-toggle');

  panel.classList.toggle('hidden', !filtersExpanded);
  button.textContent = filtersExpanded ? '▾ Filters' : '▸ Filters';
}

function renderFilterChips() {
  const chips = [];

  if (inventoryFilter.text) {
    chips.push(`
      <span class="chip">
        ${inventoryFilter.text}
        <button onclick="clearTextFilter()">✕</button>
      </span>
    `);
  }

  if (inventoryFilter.dateFrom || inventoryFilter.dateTo) {
    chips.push(`
      <span class="chip">
        Date filter
        <button onclick="clearDateFilter()">✕</button>
      </span>
    `);
  }

  document.getElementById('status-controls-chips').innerHTML = chips.join('');
}

/* -------- SORTING ---------- */

function toggleSort() {
  inventorySort.direction =
    inventorySort.direction === 'asc' ? 'desc' : 'asc';
  renderFoodInstanceList();
}

/* -------- MODE CONTROL --------------*/

function toggleMode() {

  // Inventory behavior
  if (currentView === "inventory") {
    interactionMode = interactionMode === "browse" ? "select" : "browse";
    document.body.classList.toggle("select-mode", interactionMode === "select");
    updateModeButton();
  }

  // Item behavior
  if (currentView === "item") {
    if (itemMode === "edit" && isDirty) {

      const confirmed = confirm(
        "You have unsaved changes.\n\nPress OK to discard the changes, or Cancel to stay in edit mode."
      );

      if (!confirmed) return;

      // Discard changes
      cancelEdit();
      updateModeButton();
      return;
    }

    itemMode = itemMode === "view" ? "edit" : "view";

    renderFoodInstanceDetail();  // re-render fields
    updateModeButton();
  }
}

/* ----------- SELECTING -------------- */

function handleRowClick(event, id) {
  if (interactionMode === "browse") {
    showFoodInstance(id);
    return;
  }
  // In select mode, selection is controlled in other ways.  
}

function handleRowMouseDown(event, rowEl) {
  if (interactionMode !== "select") return;

  isDragging = true;
  didDrag = false;

  const id = rowEl.dataset.id;

  // ✅ Determine drag intent ONCE
  if (selectedItems.has(id)) {
    dragAction = "remove";
    selectedItems.delete(id);
    rowEl.classList.remove("selected-row");
  } else {
    dragAction = "add";
    selectedItems.add(id);
    rowEl.classList.add("selected-row");
  }

  updateSelectionUI();
}


function handleRowMouseOver(event, rowEl) {
  if (interactionMode !== "select" || !isDragging || !dragAction) return;

  didDrag = true;

  const id = rowEl.dataset.id;

  if (dragAction === "add") {
    if (!selectedItems.has(id)) {
      selectedItems.add(id);
      rowEl.classList.add("selected-row");
      updateSelectionUI();
    }
  }

  if (dragAction === "remove") {
    if (selectedItems.has(id)) {
      selectedItems.delete(id);
      rowEl.classList.remove("selected-row");
      updateSelectionUI();
    }
  }
}

document.addEventListener("mouseup", () => {
  isDragging = false;
  dragAction = null;
  didDrag = false;
});

let touchTimer;


function handleTouchStart(event) {
  if (interactionMode !== "select") {
    touchTimer = setTimeout(() => {
      toggleMode();  // enter select mode
    }, 400);
    return;
  }

  isDragging = true;

  const rowEl = event.currentTarget;
  const id = rowEl.dataset.id;

  // same as mousedown logic
  if (selectedItems.has(id)) {
    dragAction = "remove";
    selectedItems.delete(id);
    rowEl.classList.remove("selected-row");
  } else {
    dragAction = "add";
    selectedItems.add(id);
    rowEl.classList.add("selected-row");
  }

  updateSelectionUI();
}

function handleTouchMove(event) {
  if (interactionMode !== "select" || !isDragging || !dragAction) return;

  // ✅ find element under finger
  const touch = event.touches[0];
  const el = document.elementFromPoint(touch.clientX, touch.clientY);

  const rowEl = el?.closest("tr");

  if (!rowEl) return;

  const id = rowEl.dataset.id;
  if (!id) return;

  if (dragAction === "add") {
    if (!selectedItems.has(id)) {
      selectedItems.add(id);
      rowEl.classList.add("selected-row");
      updateSelectionUI();
    }
  }

  if (dragAction === "remove") {
    if (selectedItems.has(id)) {
      selectedItems.delete(id);
      rowEl.classList.remove("selected-row");
      updateSelectionUI();
    }
  }

  // ✅ prevents scrolling while dragging
  event.preventDefault();
}

function handleTouchEnd() {
  isDragging = false;
  dragAction = null;
  clearTimeout(touchTimer);
}

function toggleRowSelection(event, id) {
  const row = document.getElementById(`row-${id}`);

  if (selectedItems.has(id)) {
    selectedItems.delete(id);
    row.classList.remove("selected-row");
  } else {
    selectedItems.add(id);
    row.classList.add("selected-row");
  }

  updateSelectionUI();
}

function updateSelectionUI() {
  const countEl = document.getElementById('selectionCount');
  if (countEl) {
    countEl.textContent = `${selectedItems.size}`;
  }
}

function updateModeButton() {
  const btn = document.getElementById("modeButton");

  if (currentView === "inventory") {
    btn.textContent = interactionMode === "select" ? "✅" : "🔍";
  }

  if (currentView === "item") {
    btn.textContent = itemMode === "edit" ? "✏️" : "👁️";
  }
}

/* --------- LABELS ----------- */

function openLabelPanel() {
  document.getElementById("labelPanel").classList.remove("hidden");
  renderLabelGrid();
}

function closeLabelPanel() {
  document.getElementById("labelPanel").classList.add("hidden");
}

function renderLabelGrid() {
  const grid = document.getElementById("labelGrid");
  grid.innerHTML = "";

  for (let i = 0; i < 10; i++) {
    const cell = document.createElement("div");
    cell.className = "label-cell";

    if (i < labelStartIndex) {
      cell.classList.add("used");
    }

    if (i === labelStartIndex) {
      cell.classList.add("active");
    }

    cell.textContent = i + 1;

    cell.onclick = () => {
      labelStartIndex = i;
      renderLabelGrid();
    };

    grid.appendChild(cell);
  }
}

function confirmLabelPrint() {
  closeLabelPanel();
  generateLabelsPDF(labelStartIndex);
}

async function generateLabelsPDF(skip=3) {
  const { jsPDF } = window.jspdf;

  const doc = new jsPDF({
    unit: "in",
    format: "letter"
  });

  const items = window._foodInstanceCache.filter(i =>
    selectedItems.has(i.InstanceID)
  );

  if (!items.length) {
    alert("No items selected");
    return;
  }

  const labelsPerPage = 10;
  const labelWidth = 4;
  const labelHeight = 2;

  const marginX = 0.1875;
  const marginY = 0.5;
  const hgap = 0.125;

  let index = skip;

  for (let i = 0; i < items.length; i++) {
    const col = index % 2;
    const row = Math.floor(index % labelsPerPage / 2);

    if (i > 0 && index % labelsPerPage === 0) {
      doc.addPage();
      index = 0;
    }

    const x = marginX + col * (labelWidth+hgap);
    const y = marginY + row * labelHeight;

    await drawLabel(doc, items[i], x, y);

    index++;
  }

  doc.save("labels.pdf");
}

async function drawLabel(doc, item, x, y) {
  const padding = 0.125; // 1/8 inch

  const labelWidth = 4;
  const labelHeight = 2;

  // ✅ Draw outer label boundary
  doc.setDrawColor(180);   // light gray for debugging
  doc.setLineWidth(0.01);
  doc.rect(x, y, labelWidth, labelHeight);

  // ✅ Draw inner printable area (optional, inset by padding)
  doc.setDrawColor(220);
  doc.rect(
    x + padding,
    y + padding,
    labelWidth - (2 * padding),
    labelHeight - (2 * padding)
  );

  const qrSize = 1.2;

  // QR canvas (temporary)
  const qrTemp = document.createElement("div");
  new QRCode(qrTemp, {
    text: JSON.stringify({ id: item.InstanceID }),
    width: 200,
    height: 200
  });

  const img = qrTemp.querySelector("canvas").toDataURL("image/png");

  // ✅ QR LEFT SIDE
  doc.addImage(img,
    "PNG",
    x + padding,
    y + padding,
    qrSize,
    qrSize
  );

  // ID and Date under QR and centered
  doc.setFontSize(12);

  // ID
  let dims = doc.getTextDimensions(item.InstanceID);
  let textY = y + padding + qrSize + dims.h + 0.1;
  doc.text(
    item.InstanceID,
    x + padding + (qrSize - dims.w)/2,
    textY
  );

  // Date
  dims = doc.getTextDimensions(item.Date);
  textY += dims.h + 0.05;
  doc.text(
    item.Date,
    x + padding + (qrSize - dims.w)/2,
    textY
  );


  // RIGHT SIDE TEXT
  const textX = x + 1.5;
  textY = y + padding;

  // Helper for clipped text
  function drawClipped(text, maxWidth, maxLines = 2) {
    const lines = doc.splitTextToSize(text || "", maxWidth).slice(0, maxLines);

    lines.forEach(line => {
      // Use actual text height for spacing
      const dims = doc.getTextDimensions(line);
      doc.text(line, textX, textY + dims.h);

      textY += dims.h + 0.05; // small padding between lines
    });

    // Add a little extra spacing between sections (Label / Date / Notes)
    textY += 0.05;
  }

  // LABEL (bold + larger)
  doc.setFont(undefined, "bold");
  doc.setFontSize(14);
  drawClipped(item.Label, 2.3);

  // KEYWORDS and NOTES (smaller)
  doc.setFont(undefined, "normal");
  doc.setFontSize(12);
  if (item.Keywords) {
    drawClipped(item.Keywords, 2.3);
  }
  if (item.Notes) {
    drawClipped(item.Notes, 2.3);
  }
}

/* ------- UTILITIES --------- */
function parseDate(value) {
  if (!value) return 0;

  // MM/DD/YYYY
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(value)) {
    const [mm, dd, yyyy] = value.split('/');
    return new Date(`${yyyy}-${mm}-${dd}`).getTime();
  }

  // MM/YYYY
  if (/^\d{1,2}\/\d{4}$/.test(value)) {
    const [mm, yyyy] = value.split('/');
    return new Date(`${yyyy}-${mm}-01`).getTime();  // use start of month
  }

  // ❗ fallback (shouldn’t really hit now)
  const d = new Date(value);
  return isNaN(d) ? 0 : d.getTime();
}
