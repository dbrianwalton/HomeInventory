<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="btm-inventory.css">

  <!-- Google OAuth -->
  <script src="https://accounts.google.com/gsi/client"></script>

  <!-- Your API interface file -->
  <script src="btm-inventory-data-api.js"></script>

  <!-- QR scanner + generator -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body { font-family: sans-serif; padding: 1rem; }
    #cameraButton {
      position: fixed;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
    }
    .card { margin-bottom: 1rem; }
  </style>
</head>

<body>

  <h1 id="app-title">Inventory</h1>

  <button id="cameraButton" onclick="startScanner()">📷</button>

  <div class="card nav-tabs">
    <button onclick="showInventory()">Inventory</button>
    <button onclick="showStorage()">Storage</button>
    <button onclick="showEvents()">Events</button>
    <button onclick="generateLabelsPDF()">
      Print Labels (${selectedItems.size})
    </button>
  </div>

  <div id="status" class="card">
    <div id="status-controls"></div>
    <div id="status-controls-chips"></div>
    <div id="status-message"></div>
  </div>

  <div id="content"></div>

  <div id="scanner-panel" style="display:none;">
    <div id="qr-reader"></div>
    <button onclick="stopScanner()">Close Scanner</button>
  </div>

<script>
/* ---------- APP STATE ---------- */

let activeTab = "inventory";
const appID = "BTM-Inventory";
const qrVersion = "1.0";


let inventorySort = {
  field: 'Date',
  direction: 'desc'
};

let inventoryFilter = {
  text: '',
  dateFrom: null,
  dateTo: null
};

let filtersExpanded = false;
let selectedItems = new Set();

/* ---------- INIT ---------- */

window.onload = async () => {
  await initAuth();  // OAuth from external JS
  await loadAllData();
  renderHome();
};

/* ---------- NAV ---------- */

function showInventory() {
  activeTab = 'inventory';
  renderHome();
}

function showEvents() {
  activeTab = 'events';
  renderEventList();
}

function showStorage() {
  activeTab = 'storage';
  renderStorageList();
}

/* ---------- HOME ---------- */

function renderHome() {
  document.getElementById('status-message').innerHTML = "Loading...";
  loadInventory().then(() => {
    document.getElementById('status-message').innerHTML = "";
    renderInventory();
  });
}

/* ---------- INVENTORY ---------- */

function renderInventory() {
  renderFilterUI();
  renderFoodInstanceList();
}

function renderFoodInstanceList() {
  let working = window._foodInstanceCache || [];
  const storageMap = window._storageMap || {};

  // ---- TEXT FILTER ----
  if (inventoryFilter.text) {
    const terms = inventoryFilter.text.split(/\s+/);

    working = working.filter(i => {
      const location = storageMap[i.StorageLocationID];
      const haystack = [
        i.Label,
        ...(i.Keywords || []),
        location?.Label || '',
        i.FoodType,
        i.FoodClassification
      ].join(' ').toLowerCase();

      return terms.every(t => haystack.includes(t));
    });
  }

  // ---- DATE FILTER ----
  if (inventoryFilter.dateFrom || inventoryFilter.dateTo) {
    working = working.filter(i => {
      if (!i.Date) return false;

      const d = new Date(i.Date);
      if (inventoryFilter.dateFrom && d < inventoryFilter.dateFrom) return false;
      if (inventoryFilter.dateTo && d > inventoryFilter.dateTo) return false;

      return true;
    });
  }

  const sorted = [...working].sort((a, b) => {
    const at = a.Date ? new Date(a.Date).getTime() : 0;
    const bt = b.Date ? new Date(b.Date).getTime() : 0;
    return inventorySort.direction === 'asc' ? at - bt : bt - at;
  });

  let html = '<div class="card"><div class="table-wrapper"><table class="inventory-table">';

  html += `<thead>
    <tr>
      <th onclick="toggleSort()">
        Date ${inventorySort.direction === 'asc' ? '▲' : '▼'}
      </th>
      <th>ID</th>
      <th>Description</th>
      <th>Storage</th>
      <th>Status</th>
    </tr>
  </thead><tbody>`;

  sorted.forEach(i => {
    const location = storageMap[i.StorageLocationID];
    html += `
      <tr onclick="showFoodInstance('${i.InstanceID}')">
      <tr
        class="${selectedItems.has(i.InstanceID) ? 'selected-row' : ''}"
        onclick="toggleRowSelection(event, '${i.InstanceID}')"
        ondblclick="showFoodInstance('${i.InstanceID}')"        
      >
        <td>${i.Date ? i.Date.substring(0,10) : ''}</td>
        <td>${i.InstanceID}</td>
        <td>${i.Label}</td>
        <td>${location?.Label || ''}</td>
        <td>${i.Status}</td>
      </tr>`;
  });

  html += '</tbody></table></div></div>';
  document.getElementById('content').innerHTML = html;
}

/* ---------- DETAIL ---------- */

function showFoodInstance(id) {
  const item = window._foodInstanceCache.find(i => i.InstanceID === id);
  if (!item) return;

  document.getElementById("content").innerHTML = `
    <h2>${item.InstanceID}</h2>
    <p>${item.Label}</p>
    <button onclick="toggleQRCode('${item.InstanceID}')">QR</button>
    <div id="qr-code-${item.InstanceID}"></div>
  `;
}

/* ---------- STORAGE ---------- */

function renderStorageList() {
  const storage = window._storageLocationCache;

  let html = '<div class="card"><table class="inventory-table"><tbody>';

  storage.forEach(s => {
    html += `
      <tr onclick="showStorageLocation('${s.StorageLocationID}')">
        <td>${s.StorageLocationID}</td>
        <td>${s.Label}</td>
        <td>${s.PhysicalLocation}</td>
      </tr>`;
  });

  html += '</tbody></table></div>';
  document.getElementById('content').innerHTML = html;
}

function showStorageLocation(id) {
  document.getElementById('status-message').innerHTML =
    '<div><em>Loading location…</em></div>';

  const location = window._storageMap[id];

  if (!location) {
    showError({ message: "Location not found" });
    return;
  }

  // ✅ Build related food instances from cache
  const foodInstances = window._foodInstanceCache.filter(
    f => f.StorageLocationID === id
  );

  // ✅ Render using same structure as API
  renderStorageLocation({
    storageLocation: location,
    foodInstances: foodInstances
  });

  document.getElementById('status-message').innerHTML = '';
}

function renderStorageLocation(data) {
  const s = data.storageLocation;

  let html = `<div class="card">
    <h2>${s?.Label}</h2>
  `;

  html += `
    <div class="card">
      <button id="qr-btn-${s.StorageLocationID}"
              onclick="toggleQRCode('storageLocation','${s.StorageLocationID}')">
        Show QR Code
      </button>
      <div id="qr-code-${s.StorageLocationID}" style="margin-top:10px;"></div>
    </div>
  `;

  html += `
    <button onclick="enterAssignmentMode('${s.StorageLocationID}')">
      Start Assigning Here
    </button>
  `;

  html += `<div class="card">`;

  data.foodInstances.forEach(f => {
    html += `<div>${f.InstanceID} - ${f.Label}</div>`;
  });

  html += `</div></div>`;

  document.getElementById('content').innerHTML = html;
}


/* ---------- QR ---------- */

function toggleQRCode(id) {
  const el = document.getElementById(`qr-code-${id}`);

  if (el.innerHTML) {
    el.innerHTML = "";
    return;
  }

  new QRCode(el, {
    text: JSON.stringify({ appID, id }),
    width: 200,
    height: 200
  });
}

/* ---------- SCANNER ---------- */

let qrScanner = null;

function startScanner() {
  document.getElementById('scanner-panel').style.display = 'block';

  qrScanner = new Html5Qrcode("qr-reader");

  qrScanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (text) => {
      handleQRCode(text);
      stopScanner();
    }
  );
}

function stopScanner() {
  if (!qrScanner) return;
  qrScanner.stop();
  qrScanner = null;
  document.getElementById('scanner-panel').style.display = 'none';
}

/* ---------- QR HANDLER ---------- */

function handleQRCode(text) {
  try {
    const obj = JSON.parse(text);
    if (obj.id) showFoodInstance(obj.id);
  } catch {
    alert("Invalid QR code");
  }
}

/* ---------- FILTERING ------------ */
function applyFilter() {
  const input = document.getElementById('filterInput');
  inventoryFilter.text = input ? input.value.trim().toLowerCase() : '';
  renderFoodInstanceList();
}

function clearTextFilter() {
  inventoryFilter.text = '';
  document.getElementById('filterInput').value = '';
  renderFoodInstanceList();
}

function applyDateFilter() {
  const from = document.getElementById('dateFrom');
  const to = document.getElementById('dateTo');

  inventoryFilter.dateFrom = from?.value
    ? new Date(from.value + 'T00:00:00')
    : null;

  inventoryFilter.dateTo = to?.value
    ? new Date(to.value + 'T23:59:59')
    : null;

  renderFoodInstanceList();
}

function renderFilterUI() {
  document.getElementById('status-controls').innerHTML = `
    <div class="filters-header-row">
      <button
        class="filters-toggle"
        onclick="toggleFilters()"
        aria-expanded="${filtersExpanded}"
      >
        ${filtersExpanded ? '▾ Filters' : '▸ Filters'}
      </button>

      <input
        id="filterInput"
        type="text"
        placeholder="Filter by description or keywords"
        value="${inventoryFilter.text || ''}"
        oninput="applyFilter()"
      />

      <button onclick="clearTextFilter()">X</button>
    </div>

    <div id="filters-panel"
        class="filters-panel ${filtersExpanded ? '' : 'hidden'}">

      <div class="filter-row">
        <span class="filter-label">Date:</span>
        <input type="date" id="dateFrom" onchange="applyDateFilter()" />
        <span class="date-range-sep">–</span>
        <input type="date" id="dateTo" onchange="applyDateFilter()" />
      </div>

    </div>
  `;
}

function toggleFilters() {
  filtersExpanded = !filtersExpanded;

  const panel = document.getElementById('filters-panel');
  const button = document.querySelector('.filters-toggle');

  panel.classList.toggle('hidden', !filtersExpanded);
  button.textContent = filtersExpanded ? '▾ Filters' : '▸ Filters';
}

function renderFilterChips() {
  const chips = [];

  if (inventoryFilter.text) {
    chips.push(`
      <span class="chip">
        ${inventoryFilter.text}
        <button onclick="clearTextFilter()">✕</button>
      </span>
    `);
  }

  if (inventoryFilter.dateFrom || inventoryFilter.dateTo) {
    chips.push(`
      <span class="chip">
        Date filter
        <button onclick="clearDateFilter()">✕</button>
      </span>
    `);
  }

  document.getElementById('status-controls-chips').innerHTML = chips.join('');
}

/* -------- SORTING ---------- */

function toggleSort() {
  inventorySort.direction =
    inventorySort.direction === 'asc' ? 'desc' : 'asc';
  renderFoodInstanceList();
}

/* ----------- SELECTING -------------- */

function toggleRowSelection(event, id) {
  event.stopPropagation(); // prevent detail view navigation

  if (selectedItems.has(id)) {
    selectedItems.delete(id);
  } else {
    selectedItems.add(id);
  }

  renderFoodInstanceList(); // re-render updates highlight
}

/* --------- LABELS ----------- */

async function generateLabelsPDF() {
  const { jsPDF } = window.jspdf;

  const doc = new jsPDF({
    unit: "in",
    format: "letter"
  });

  const items = window._foodInstanceCache.filter(i =>
    selectedItems.has(i.InstanceID)
  );

  if (!items.length) {
    alert("No items selected");
    return;
  }

  const labelsPerPage = 8;
  const labelWidth = 4;
  const labelHeight = 2;

  const marginX = 0.25;
  const marginY = 0.5;

  let index = 0;

  for (let i = 0; i < items.length; i++) {
    const col = index % 2;
    const row = Math.floor(index % labelsPerPage / 2);

    if (i > 0 && index % labelsPerPage === 0) {
      doc.addPage();
      index = 0;
    }

    const x = marginX + col * labelWidth;
    const y = marginY + row * labelHeight;

    await drawLabel(doc, items[i], x, y);

    index++;
  }

  doc.save("labels.pdf");
}

async function drawLabel(doc, item, x, y) {
  const padding = 0.125; // 1/8 inch
  const qrSize = 1.2;

  // QR canvas (temporary)
  const qrTemp = document.createElement("div");
  new QRCode(qrTemp, {
    text: JSON.stringify({ id: item.InstanceID }),
    width: 200,
    height: 200
  });

  const img = qrTemp.querySelector("canvas").toDataURL("image/png");

  // ✅ QR LEFT SIDE
  doc.addImage(img,
    "PNG",
    x + padding,
    y + padding,
    qrSize,
    qrSize
  );

  // ✅ ID under QR
  doc.setFontSize(8);
  doc.text(
    item.InstanceID,
    x + padding,
    y + padding + qrSize + 0.15
  );

  // ✅ RIGHT SIDE TEXT
  const textX = x + 1.5;
  let textY = y + padding;

  doc.setFontSize(10);

  // Helper for clipped text
  function drawClipped(text, maxWidth) {
    const lines = doc.splitTextToSize(text || "", maxWidth);
    lines.slice(0, 2).forEach(line => {
      doc.text(line, textX, textY);
      textY += 0.25;
    });
  }

  drawClipped(item.Label, 2.3);
  drawClipped(item.DateCreated, 2.3);
  drawClipped(item.Notes, 2.3);
}


</script>
</body>
</html>
