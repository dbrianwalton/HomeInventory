<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="btm-inventory.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Inventory">

  <!-- Google OAuth -->
  <script src="https://accounts.google.com/gsi/client"></script>

  <!-- Your API interface file -->
  <script src="btm-inventory-data-api.js"></script>

  <!-- QR scanner + generator -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body { font-family: sans-serif; padding: 1rem; }
    #cameraButton {
      position: fixed;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
    }
    .card { margin-bottom: 1rem; }
  </style>
</head>

<body>

  <h1 id="app-title">Inventory</h1>

  <button id="settingsButton" class="top-button" title="Settings" onclick="openSettings()">⚙️</button>
  <button id="cameraButton" class="top-button" title="QR reader" onclick="startScanner()">📷</button>
  <button id="labelButton" class="top-button" title="Labels" onclick="openLabelPanel()">🏷️</button>
  <div class="mode-wrapper">
    <button id="modeButton" class="top-button" title="Mode" onclick="toggleMode()">🔍</button>
    <div id="selectionCount"></div>
  </div>

  <div class="card nav-tabs">
    <button onclick="showInventory()">Inventory</button>
    <button onclick="showStorage()">Storage</button>
    <button onclick="showEvents()">Events</button>
  </div>

  <div id="status" class="card">
    <div id="status-controls"></div>
    <div id="status-controls-chips"></div>
    <div id="status-message"></div>
  </div>

  <div id="content"></div>

  <div id="scanner-panel" style="display:none;">
    <div id="qr-reader"></div>
    <button onclick="stopScanner()">Close Scanner</button>
  </div>

  <div id="labelPanel" class="label-panel hidden">

    <div class="label-panel-content">

      <h3>Print Labels</h3>

      <!-- Format -->
      <label>Label Format</label>
      <select id="labelFormat">
        <option value="2x4-10">2" x 4" (10 per page)</option>
      </select>

      <!-- Layout picker -->
      <label>Start Position</label>
      <div id="labelGrid" class="label-grid"></div>

      <!-- Buttons -->
      <div class="label-actions">
        <button onclick="confirmLabelPrint()">Create PDF</button>
        <button onclick="closeLabelPanel()">Cancel</button>
      </div>

    </div>
  </div>

  <div id="settingsPanel" class="settings-panel hidden">
    <div class="settings-content">

      <h3>Settings ⚙️</h3>

      <label>Google Sheet ID</label>
      <input id="settings-sheetId" placeholder="Paste Sheet URL or ID" />

      <div class="settings-actions">
        <button onclick="saveSettings()">Save</button>
        <button onclick="closeSettings()">Cancel</button>
      </div>

    </div>
  </div>

<script>
/* ---------- APP STATE ---------- */

let activeTab = "inventory";
const appID = "BTM-Inventory";
const qrVersion = "1.0";

let currentView = "food-list"; // "inventory" | "item"
let interactionMode = "browse";  // "browse" | "select"
let itemMode = "view"; // "view" | "edit"

let navStack = [];

let originalItem = null;
let currentItem = null;
let isDirty = false;

let isDragging = false;
let didDrag = false;
let dragAction = null;  // "add" | "remove" | null

let inventorySort = {
  field: 'Date',
  direction: 'desc'
};

let inventoryFilter = {
  text: '',
  dateFrom: null,
  dateTo: null
};
let storageFilter = {
  text: ''
};

let filtersExpanded = false;

let selectedItems = new Set();

let labelStartIndex = 0;
let labelDrawBoundary = false;

/* ---------- INIT ---------- */

window.onload = async () => {
  if (!getSheetId()) {
    openSettings();
    return;
  }

  await initAuth();  // OAuth from external JS

  await loadAllData();
  renderHome();
};

window.addEventListener("beforeunload", (e) => {
  if (itemMode === "edit" && isDirty) {
    e.preventDefault();
    e.returnValue = "";
  }
});

function promptForSheetId() {
  const raw = prompt("Enter your Google Sheet URL or ID:");
  const id = extractSheetId(raw);

  if (!id) {
    alert("A valid Sheet ID is required.");
    return;
  }

  localStorage.setItem("sheetId", id.trim());

  location.reload();
}

/* ---------- SETTINGS ---------- */

function getSheetId() {
  return localStorage.getItem("sheetId");
}

function openSettings() {
  const panel = document.getElementById("settingsPanel");

  // preload current values
  document.getElementById("settings-sheetId").value =
    getSheetId() || "";

  panel.classList.remove("hidden");
}

function closeSettings() {
  document.getElementById("settingsPanel").classList.add("hidden");
}

function extractSheetId(input) {
  const match = input.match(/\/d\/([a-zA-Z0-9-_]+)/);
  return match ? match[1] : input;
}

function saveSettings() {
  const raw = document.getElementById("settings-sheetId").value;

  const sheetId = extractSheetId(raw);

  if (!sheetId) {
    alert("Sheet ID is required");
    return;
  }

  localStorage.setItem("sheetId", sheetId);

  closeSettings();
  location.reload();
}

function clearSettings() {
  localStorage.removeItem("sheetId");
  location.reload();
}

/* ---------- NAV ---------- */

function pushView() {
  navStack.push({
    currentView,
    currentItem: currentItem ? { ...currentItem } : null,
    itemMode
  });
}

function goBack() {
  if (!navStack.length) {
    if (currentItem?.InstanceID?.startsWith("FI")) {
      showInventory();
      return;
    }

    if (currentItem?.StorageLocationID?.startsWith("SL")) {
      showStorage();
      return;
    }
    
    showInventory();
    return;
  }

  const prev = navStack.pop();

  currentView = prev.currentView;
  currentItem = prev.currentItem;
  itemMode = prev.itemMode;

  updateModeButton();

  if (currentView === "food-list") {
    renderHome();
  } else if (currentView === "food-item") {
    renderFoodInstanceDetail();
  } else if (currentView === "storage-list") {
    renderStorageList();
  } else if (currentView === "storage-item") {
    renderStorageDetail();
  }
}

function showInventory() {
  navStack = [];
  clearSelection();

  activeTab = 'inventory';
  currentView = "food-list";

  document.getElementById("modeButton").style.display = "block";
  
  updateModeButton();
  renderHome();
}

function showEvents() {
  navStack = [];
  clearSelection();
  activeTab = 'events';
  renderEventList();
}

function showStorage() {
  navStack = [];
  clearSelection();

  activeTab = 'storage';
  currentView = "storage-list";

  renderStorageList();
}

/* ---------- HOME ---------- */

function renderHome() {
  document.getElementById('status-message').innerHTML = "Loading...";
  loadInventory().then(() => {
    document.getElementById('status-message').innerHTML = "";
    renderInventory();
  });
}

/* ---------- INVENTORY ---------- */

function renderTable({
  container,
  columns,
  rows,
  getRowId,
  onRowClick,
  enableSelection = false
}) {
  const html = `
    <div class="card">
      <div class="table-wrapper">
        <table class="inventory-table">
          <thead>
            <tr>
              ${columns.map((c,idx) => `
                <th data-col-index="${idx}" ${c.field ? 'class="sortable"' : ''}>
                  ${c.label} ${
                    inventorySort.field === c.field
                      ? (inventorySort.direction === 'asc' ? '▲' : '▼')
                      : ''
                  }
                </th>
              `).join('')}
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr data-id="${getRowId(r)}">
                ${columns.map(c => `<td>${c.render(r) || ''}</td>`).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  container.innerHTML = html;

  const thead = container.querySelector("thead");

  thead.addEventListener("click", (e) => {
    const th = e.target.closest("th");
    if (!th) return;

    const idx = th.dataset.colIndex;
    if (idx === undefined) return;

    const col = columns[idx];
    if (!col.field) return;

    handleSort(col.field);
  });

  const tbody = container.querySelector("tbody");

  // Row click
  tbody.addEventListener("click", (e) => {
    const row = e.target.closest("tr");
    if (!row) return;
    if (isDragging) return;

    const id = row.dataset.id;

    if (!enableSelection) {
      onRowClick?.(e, id);
    } else {
      // Only allow navigation in browse mode
      if (interactionMode === "browse") {
        onRowClick?.(e, id);
      }
    }
  });

  // Selection support only when enabled
  if (enableSelection) {
    tbody.addEventListener("mousedown", (e) => {
      const row = e.target.closest("tr");
      if (!row) return;
      handleRowMouseDown(e, row);
    });

    tbody.addEventListener("mouseover", (e) => {
      const row = e.target.closest("tr");
      if (!row) return;
      handleRowMouseOver(e, row);
    });
  }
}


function renderInventory() {
  updateFilterVisibility();
  renderFoodInstanceList();
}

function renderFoodInstanceList() {
  let working = window._foodInstanceCache || [];
  const storageMap = window._storageMap || {};

  // ---- TEXT FILTER ----
  if (inventoryFilter.text) {
    const terms = inventoryFilter.text.split(/\s+/);

    working = working.filter(i => {
      const location = storageMap[i.StorageLocationID];
      const haystack = [
        i.Label,
        i.Keywords,
        i.Notes,
        location?.Label || '',
        i.FoodType,
        i.FoodClassification
      ]
        .filter(Boolean)
        .join(' ')
        .toLowerCase()
        .replace(/\s+/g, ' ');

      return terms.every(t => haystack.includes(t));
    });
  }

  // ---- DATE FILTER ----
  if (inventoryFilter.dateFrom || inventoryFilter.dateTo) {
    working = working.filter(i => {
      if (!i.Date) return false;

      const d = parseDate(i.Date);
      if (inventoryFilter.dateFrom && d < inventoryFilter.dateFrom) return false;
      if (inventoryFilter.dateTo && d > inventoryFilter.dateTo) return false;

      return true;
    });
  }

  const sorted = [...working].sort((a, b) => {
    let at = a[inventorySort.field];
    let bt = b[inventorySort.field];

    if (inventorySort.field === "Date") {
      at = at ? parseDate(at) : 0;
      bt = bt ? parseDate(bt) : 0;
    }

    if (at < bt) return inventorySort.direction === 'asc' ? -1 : 1;
    if (at > bt) return inventorySort.direction === 'asc' ? 1 : -1;
    return 0;
  });

  
  const container = document.getElementById('content');

  renderTable({
    container,
    rows: sorted,
    getRowId: r => r.InstanceID,
    enableSelection: true,
    onRowClick: (event, id) => {
      if (interactionMode === "browse") {
        showFoodInstance(id);
      }
    },
    columns: [
      {
        label: "Date",
        field: "Date",
        render: r => r.Date || ''
      },
      {
        label: "ID",
        render: r => r.InstanceID
      },
      {
        label: "Description",
        render: r => r.Label
      },
      {
        label: "Storage",
        render: r => window._storageMap?.[r.StorageLocationID]?.Label || '',
        field: "StorageLocationID"
      },
      {
        label: "Status",
        render: r => r.Status
      }
    ]
  });
}


function showFoodInstance(id) {
  pushView();
  currentView = "food-item";

  document.getElementById("modeButton").style.display = "block";

  const item = window._foodInstanceCache.find(i => i.InstanceID === id);
  if (!item) return;

  originalItem = item;
  currentItem = { ...item };
  itemMode = "view";

  updateModeButton();
  renderFoodInstanceDetail();
}

async function saveFoodInstance(addAnother = false) {

  currentItem.Label = document.getElementById("fld-label").value;
  currentItem.Keywords = document.getElementById("fld-keywords").value;
  currentItem.Notes = document.getElementById("fld-notes").value;
  currentItem.Size = document.getElementById("fld-size").value;
  currentItem.Date = document.getElementById("fld-date").value;

  currentItem.StorageType =
    document.getElementById("fld-storageType")?.value || currentItem.StorageType;

  currentItem.StorageLocationID =
    document.getElementById("fld-storageLocation")?.value || currentItem.StorageLocationID;

  const changes = getChangedFields(originalItem, currentItem);

  if (!Object.keys(changes).length) {
    alert("No changes to save");
    return;
  }

  try {
    await updateFoodInstance(currentItem.InstanceID, changes);

    // update local cache to reflect changes
    const idx = window._foodInstanceCache.findIndex(
      i => i.InstanceID === currentItem.InstanceID
    );
    if (idx !== -1) {
      window._foodInstanceCache[idx] = { ...currentItem };
    }

    isDirty = false;
    showInventory();

  } catch (err) {
    console.error(err);
    alert("Error saving data");
  }
}

/* ---------- STORAGE ---------- */

function renderStorageList() {
  updateFilterVisibility();
  let working = window._storageLocationCache || [];

  if (storageFilter.text) {
    const terms = storageFilter.text.split(/\s+/);

    working = working.filter(s => {
      const haystack = [
        s.Label,
        s.Notes,
        s.PhysicalLocation
      ]
        .filter(Boolean)
        .join(' ')
        .toLowerCase();

      return terms.every(t => haystack.includes(t));
    });
  }

  
const container = document.getElementById("content");

  renderTable({
    container,
    rows: working,
    getRowId: r => r.StorageLocationID,
    enableSelection: true,
    onRowClick: (event, id) => {
      if (interactionMode === "browse") {
        showStorageLocation(id);
      }
    },
    columns: [
      { label: "ID", render: r => r.StorageLocationID },
      { label: "Label", render: r => r.Label },
      { label: "Location", render: r => r.PhysicalLocation }
    ]
  });
}


function showStorageLocation(id) {
  pushView();
  currentView = "storage-item";

  const item = window._storageMap[id];
  if (!item) return;

  currentItem = { ...item };
  originalItem = item;

  itemMode = "view";

  updateModeButton();
  renderStorageDetail();
}

function renderStorageDetail() {
  updateFilterVisibility();

  const item = currentItem;
  const readOnly = itemMode === "view" ? "readonly" : "";

  document.getElementById("cameraButton").disabled = (itemMode === "edit");

  // Gather related food items
  const related = (window._foodInstanceCache || [])
    .filter(i => i.StorageLocationID === item.StorageLocationID)
    .sort((a, b) => parseDate(b.Date) - parseDate(a.Date));

  let html = `
  <div class="card ${itemMode === "edit" ? "edit-mode" : "view-mode"}">
    <h2>${item.StorageLocationID}</h2>

    <div class="field-row">
      <label>Label</label>
      <input id="fld-label" value="${item.Label || ''}" ${readOnly}
        ${itemMode === "edit" ? 'oninput="markDirty()"' : ''} />
    </div>

    <div class="field-row">
      <label>Notes</label>
      <input id="fld-notes" value="${item.Notes || ''}" ${readOnly}
        ${itemMode === "edit" ? 'oninput="markDirty()"' : ''} />
    </div>

    <div class="field-row">
      <label>Physical Location</label>
      <input id="fld-physical" value="${item.PhysicalLocation || ''}" ${readOnly}
        ${itemMode === "edit" ? 'oninput="markDirty()"' : ''} />
    </div>

    <!-- Related FoodInstances -->
    <div id="related-food"></div>
  `;

  html += `
    <div style="margin-top: 1rem;">
      ${
        itemMode === "view"
        ? `
          <button onclick="enterEditMode()">Edit</button>
          <button onclick="goBack()">Close</button>
        `
        : `
          <button onclick="saveStorage()">Save</button>
          <button onclick="cancelEdit()">Cancel</button>
        `
      }
    </div>
  </div>
  `;

  document.getElementById("content").innerHTML = html;

  const relatedContainer = document.getElementById("related-food");

  renderTable({
    container: relatedContainer,
    rows: related,
    getRowId: r => r.InstanceID,
    enableSelection: false,
    onRowClick: (event, id) => {
      showFoodInstance(id);
    },
    columns: [
      { label: "Date", render: r => r.Date || '' },
      { label: "ID", render: r => r.InstanceID },
      { label: "Description", render: r => r.Label || '' },
      { label: "Status", render: r => r.Status || '' }
    ]
});
}

async function saveStorage() {
  currentItem.Label = document.getElementById("fld-label").value;
  currentItem.Notes = document.getElementById("fld-notes").value;
  currentItem.PhysicalLocation = document.getElementById("fld-physical").value;

  const changes = getChangedFields(originalItem, currentItem);

  if (!Object.keys(changes).length) {
    alert("No changes");
    return;
  }

  await updateStorageLocation(currentItem.StorageLocationID, changes);

  Object.assign(originalItem, currentItem);

  isDirty = false;
  itemMode = "view";

  renderStorageDetail();
}

/* -------- VIEW/EDIT ITEM ----------- */

const ENTITY_FIELDS = {
  "food-item": [
    { key: "StorageLocationID", label: "Storage Location", type: "storage-select" },
    { key: "Label", label: "Label", type: "text" },
    { key: "Keywords", label: "Keywords", type: "text" },
    { key: "Notes", label: "Notes", type: "text" },
    { key: "Size", label: "Size", type: "text" },
    { key: "Date", label: "Date", type: "text" },
    {
      key: "StorageType",
      label: "Storage Type",
      type: "select",
      options: ["Freeze-Dried","Frozen","Bottled","Canned","Boxed","Other"]
    }
  ],

  "storage-item": [
    { key: "Label", label: "Label", type: "text" },
    { key: "Notes", label: "Notes", type: "text" },
    { key: "PhysicalLocation", label: "Physical Location", type: "text" }
  ]
};

const DETAIL_ACTIONS = {
  view: [
    { action: "edit", label: "Edit" },
    { action: "close", label: "Close" }
  ],
  edit: [
    { action: "save", label: "Save" },
    { action: "cancel", label: "Cancel" }
  ]
};



function renderField(field, item, readOnly) {
  const value = item[field.key] || '';

  // Storage special case
  if (field.type === "storage-select") {
    const storage = window._storageMap?.[value];
    const storageText = storage
      ? `${storage.Label} (${storage.PhysicalLocation})`
      : "Unassigned";

    if (readOnly) {
      return `<button data-storage-link="${value}">
        ${storageText}
      </button>`;
    }

    return `
      <select data-field="${field.key}">
        ${(window._storageLocationCache || []).map(s => `
          <option value="${s.StorageLocationID}"
            ${s.StorageLocationID === value ? "selected" : ""}>
            ${s.Label} (${s.PhysicalLocation})
          </option>
        `).join('')}
      </select>
    `;
  }

  // Select (dropdown list)
  if (field.type === "select") {
    if (readOnly) {
      return `<div>${value}</div>`;
    }

    return `
      <select data-field="${field.key}">
        ${field.options.map(opt => `
          <option ${opt === value ? "selected" : ""}>${opt}</option>
        `).join('')}
      </select>
    `;
  }

  // Default text
  return `
    <input
      data-field="${field.key}"
      value="${value}"
      ${readOnly ? "readonly" : ""}
    />
  `;
}

function renderDetailForm(entityType, item) {
  const fields = ENTITY_FIELDS[entityType];

  return fields.map(f => `
    <div class="field-row">
      <label>${f.label}</label>
      ${renderField(f, item, itemMode === "view")}
    </div>
  `).join('');
}

function renderDetailActions() {
  const actions = DETAIL_ACTIONS[itemMode];

  const buttons = actions.map(a =>
    '<button data-action="' + a.action + '">' + a.label + '</button>'
  ).join('');

  return `
    <div class="detail-actions">
      ${buttons}
    </div>
  `;
}

function bindDetailEvents() {
  const container = document.getElementById("content");

  // input / select changes
  container.querySelectorAll("[data-field]").forEach(el => {
    el.addEventListener("input", () => {
      const key = el.dataset.field;
      currentItem[key] = el.value;
      markDirty();
    });

    el.addEventListener("change", () => {
      const key = el.dataset.field;
      currentItem[key] = el.value;
      markDirty();
    });
  });

  // storage link (view mode)
  container.querySelectorAll("[data-storage-link]").forEach(el => {
    el.addEventListener("click", () => {
      showStorageLocation(el.dataset.storageLink);
    });
  });

  // action buttons
  container.querySelectorAll("[data-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const action = btn.dataset.action;

      switch (action) {
        case "edit":
          enterEditMode();
          break;

        case "close":
          goBack();
          break;

        case "save":
          if (currentView === "food-item") {
            saveFoodInstance();
          } else if (currentView === "storage-item") {
            saveStorage();
          }
          break;

        case "cancel":
          cancelEdit();
          break;
      }
    });
  });
}

function renderFoodInstanceDetail() {
  updateFilterVisibility();

  const item = currentItem;

  let html = `
    <div class="card ${itemMode === "edit" ? "edit-mode" : "view-mode"}">
      <h2>${item.InstanceID}</h2>

      ${renderDetailForm("food-item", item)}

      <div style="margin-top: 1rem;">
        ${renderDetailActions()}
      </div>
    </div>
  `;

  document.getElementById("content").innerHTML = html;

  bindDetailEvents();
}

function renderStorageDetail() {
  updateFilterVisibility();

  const item = currentItem;

  let html = `
    <div class="card ${itemMode === "edit" ? "edit-mode" : "view-mode"}">
      <h2>${item.StorageLocationID}</h2>

      ${renderDetailForm("storage-item", item)}

      <div id="related-food"></div>

      <div style="margin-top: 1rem;">
        ${renderDetailActions()}
      </div>
    </div>
  `;

  document.getElementById("content").innerHTML = html;

  bindDetailEvents();

  // existing related-table render stays as-is
  const related = (window._foodInstanceCache || [])
    .filter(i => i.StorageLocationID === item.StorageLocationID);

  renderTable({
    container: document.getElementById("related-food"),
    rows: related,
    getRowId: r => r.InstanceID,
    enableSelection: false,
    onRowClick: (e, id) => showFoodInstance(id),
    columns: [
      { label: "Date", render: r => r.Date || '' },
      { label: "ID", render: r => r.InstanceID },
      { label: "Description", render: r => r.Label || '' },
      { label: "Status", render: r => r.Status || '' }
    ]
  });
}


/* ------- EDITING ITEMS ------------ */

function getChangedFields(original, updated) {
  const changes = {};

  Object.keys(updated).forEach(key => {
    if (updated[key] !== original[key]) {
      changes[key] = updated[key];
    }
  });

  return changes;
}

function markDirty() {
  isDirty = true;
  document.getElementById("modeButton")?.classList.add("dirty");
}

function clearDirty() {
  isDirty = false;
  document.getElementById("modeButton")?.classList.remove("dirty");
}

function enterEditMode() {
  itemMode = "edit";
  clearDirty();
  updateModeButton();
  switch (currentView) {
    case "food-item":
      renderFoodInstanceDetail();
      break;
    case "storage-item":
      renderStorageDetail();
      break;
  }
  
}

function cancelEdit() {
  itemMode = "view";
  clearDirty(); 
  updateModeButton();
  
  // reload original
  let original;
  switch (currentView) {
    case "food-item":
      original = window._foodInstanceCache.find(i => i.InstanceID === currentItem.InstanceID);
      currentItem = { ...original };
      renderFoodInstanceDetail();
      break;
    case "storage-item":
      original = window._storageLocationCache.find(i => i.StorageLocationID === currentItem.StorageLocationID);
      currentItem = { ...original };
      renderStorageDetail();
      break;
  } 
}


/* ---------- QR ---------- */

function toggleQRCode(id) {
  const el = document.getElementById(`qr-code-${id}`);

  if (el.innerHTML) {
    el.innerHTML = "";
    return;
  }

  new QRCode(el, {
    text: JSON.stringify({ appID, id }),
    width: 200,
    height: 200
  });
}

/* ---------- SCANNER ---------- */

let qrScanner = null;

function startScanner() {
  document.getElementById('scanner-panel').style.display = 'block';

  qrScanner = new Html5Qrcode("qr-reader");

  qrScanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (text) => {
      handleQRCode(text);
      stopScanner();
    }
  );
}

function stopScanner() {
  if (!qrScanner) return;
  qrScanner.stop();
  qrScanner = null;
  document.getElementById('scanner-panel').style.display = 'none';
}

/* ---------- QR HANDLER ---------- */

function handleQRCode(text) {
  try {
    const obj = JSON.parse(text);

    if (!obj.id) return;

    const id = obj.id;

    // STORAGE LOCATION
    if (id.startsWith("SL")) {
      handleStorageScan(id);
      return;
    }

    // FOOD INSTANCE
    if (id.startsWith("FI")) {
      handleFoodScan(id);
      return;
    }

    // Unknown type
    alert("Unrecognized QR code");

  } catch {
    alert("Invalid QR code");
  }
}

async function handleFoodScan(foodID) {
  if (currentView === "storage-item") {
    if (itemMode !== "view") return;

    const confirmed = confirm("Assign item to this location?");
    if (!confirmed) return;

    const food = window._foodInstanceCache.find(f => f.InstanceID === foodID);

    const updated = {
      ...food,
      StorageLocationID: currentItem.StorageLocationID
    };

    const changes = getChangedFields(food, updated);

    await updateFoodInstance(foodID, changes);

    alert("Item assigned to Storage Location");
  }
}

async function handleStorageScan(storageID) {

  /* --- When in FoodInstance view --- */
  if (currentView === "food-item") {
    const currentID = currentItem.StorageLocationID;
    if (currentID === storageID) return;

    // EDIT MODE → apply immediately
    if (itemMode === "edit") {
      currentItem.StorageLocationID = storageID;
      
      renderFoodInstanceDetail();
      setTimeout(() => {
        document.querySelector("#fld-storageLocation")?.classList.add("highlight");
      }, 50);

      markDirty();
      return;
    }

    // VIEW MODE → confirm + save
    if (itemMode === "view") {
      const storage = window._storageMap[storageID];
      const confirmed = confirm(
        `Move item to:\n\n${storage?.Label} (${storage?.PhysicalLocation})?\n`
      );

      if (!confirmed) return;

      // Build updated item (copy)
      const updated = {
        ...currentItem,
        StorageLocationID: storageID
      };

      const changes = getChangedFields(originalItem, updated);

      try {
        await updateFoodInstance(currentItem.InstanceID, changes);
        const idx = window._foodInstanceCache.findIndex(
          i => i.InstanceID === currentItem.InstanceID
        );

        if (idx !== -1) {
          window._foodInstanceCache[idx] = { ...updated };
        }

        currentItem = updated;
        originalItem = { ...updated };

        alert("Storage location updated");
        renderFoodInstanceDetail();

        setTimeout(() => {
          document.querySelector("#fld-storageLocation")?.classList.add("highlight");
        }, 50);

        return;
      } catch (err) {
        alert("Error updating storage location: " + err.message);
      }
    }
  }

}

/* ---------- FILTERING ------------ */
const FILTER_CONFIG = {
  "food-list": {
    placeholder: "Filter by description or keywords",

    getValue: () => inventoryFilter.text || "",
    setValue: (v) => { inventoryFilter.text = v; },
    onApply: renderFoodInstanceList,

    showDate: true,
    getDateFrom: () => inventoryFilter.dateFrom,
    getDateTo: () => inventoryFilter.dateTo,
    clearDate: () => {
      inventoryFilter.dateFrom = null;
      inventoryFilter.dateTo = null;
    },

    chips: [
      {
        getValue: () => inventoryFilter.text,
        label: (v) => v,
        onClear: () => {
          inventoryFilter.text = '';
          renderFoodInstanceList();
          renderFilterChips();
        }
      },
      {
        getValue: () => inventoryFilter.dateFrom || inventoryFilter.dateTo ? true : null,
        label: () => "Date filter",
        onClear: () => {
          inventoryFilter.dateFrom = null;
          inventoryFilter.dateTo = null;
          renderFoodInstanceList();
          renderFilterChips();
        }
      }
    ]
  },

  "storage-list": {
    placeholder: "Filter storage",

    getValue: () => storageFilter.text || "",
    setValue: (v) => { storageFilter.text = v; },
    onApply: renderStorageList,

    showDate: false,

    chips: [
      {
        getValue: () => storageFilter.text,
        label: (v) => v,
        onClear: () => {
          storageFilter.text = '';
          renderStorageList();
          renderFilterChips();
        }
      }
    ]
  }
};

function renderFilterUI() {
  const config = FILTER_CONFIG[currentView];
  if (!config) return;

  const value = config.getValue();

  document.getElementById('status-controls').innerHTML = `
    <div class="filters-header-row">

      ${config.showDate ? `
        <button
          class="filters-toggle"
          aria-expanded="${filtersExpanded}"
        >
          ${filtersExpanded ? '▾ Filters' : '▸ Filters'}
        </button>
      ` : ''}

      <input
        id="filterInput"
        type="text"
        placeholder="${config.placeholder}"
        value="${value}"
      />

      <button id="filterClearBtn">X</button>
    </div>

    ${config.showDate ? buildDatePanel(config) : ''}
  `;
}

function renderFilterChips() {
  const config = FILTER_CONFIG[currentView];
  if (!config?.chips) return;

  const chips = config.chips
    .map( (chip,idx) => {
      const value = chip.getValue();
      if (!value) return null;

      const label = typeof chip.label === 'function'
        ? chip.label(value)
        : chip.label;

      return `
        <span class="chip">
          ${label}
          <button data-chip-index="${idx}">✕</button>
        </span>
      `;
    })
    .filter(Boolean)
    .join('');

  const container = document.getElementById('status-controls-chips');
  container.innerHTML = chips;

  // attach clear handlers (no inline onclick needed)
  container.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const idx = e.currentTarget.dataset.chipIndex;
      const chip = config.chips[idx];

      chip.onClear();
    });
  });
}

function buildDatePanel(config) {
  const from = config.getDateFrom?.();
  const to = config.getDateTo?.();

  return `
    <div id="filters-panel"
      class="filters-panel ${filtersExpanded ? '' : 'hidden'}">

      <div class="filter-row">
        <span class="filter-label">Date:</span>

        <input
          type="date"
          id="dateFrom"
          value="${from ? new Date(from).toISOString().slice(0,10) : ''}"
        />

        <span class="date-range-sep">–</span>

        <input
          type="date"
          id="dateTo"
          value="${to ? new Date(to).toISOString().slice(0,10) : ''}"
        />

      </div>
    </div>
  `;
}

function applyCurrentFilter() {
  const config = FILTER_CONFIG[currentView];
  if (!config) return;

  const input = document.getElementById('filterInput');
  const text = input ? input.value.trim().toLowerCase() : '';

  config.setValue(text);
  config.onApply();
  renderFilterChips();
}

function clearCurrentFilter() {
  const config = FILTER_CONFIG[currentView];
  if (!config) return;

  config.setValue('');

  const input = document.getElementById('filterInput');
  if (input) input.value = '';

  config.onApply();
  renderFilterChips();
}


function updateFilterVisibility() {
  function bindFilterEvents() {
    const config = FILTER_CONFIG[currentView];
    if (!config) return;

    // text input
    const input = document.getElementById('filterInput');
    if (input) {
      input.addEventListener('input', applyCurrentFilter);
    }

    // clear button
    const clearBtn = document.getElementById('filterClearBtn');
    if (clearBtn) {
      clearBtn.addEventListener('click', clearCurrentFilter);
    }

    // toggle button
    const toggleBtn = document.querySelector('.filters-toggle');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', toggleFilters);
    }

    // date inputs
    const from = document.getElementById('dateFrom');
    const to = document.getElementById('dateTo');

    if (from) from.addEventListener('change', applyDateFilter);
    if (to) to.addEventListener('change', applyDateFilter);
  }
  
  const controls = document.getElementById('status-controls');
  const chips = document.getElementById('status-controls-chips');

  const config = FILTER_CONFIG[currentView];

  if (!config) {
    controls.innerHTML = '';
    chips.innerHTML = '';
    return;
  }

  renderFilterUI();
  renderFilterChips();
  bindFilterEvents();
}


function applyDateFilter() {
  const config = FILTER_CONFIG[currentView];
  if (!config) return;

  const from = document.getElementById('dateFrom');
  const to = document.getElementById('dateTo');

  inventoryFilter.dateFrom = from?.value
    ? new Date(from.value + 'T00:00:00').getTime()
    : null;

  inventoryFilter.dateTo = to?.value
    ? new Date(to.value + 'T23:59:59').getTime()
    : null;

  config.onApply();
  renderFilterChips();
}

function clearDateFilter() {
  inventoryFilter.dateFrom = null;
  inventoryFilter.dateTo = null;

  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';

  renderFoodInstanceList();
  updateFilterVisibility();
  renderFilterChips();
}


function toggleFilters() {
  filtersExpanded = !filtersExpanded;

  const panel = document.getElementById('filters-panel');
  const button = document.querySelector('.filters-toggle');

  if (panel) {
    panel.classList.toggle('hidden', !filtersExpanded);
  }

  if (button) {
    button.textContent = filtersExpanded ? '▾ Filters' : '▸ Filters';
  }
}

/* -------- SORTING ---------- */

function handleSort(field) {
  if (inventorySort.field === field) {
    inventorySort.direction = inventorySort.direction === 'asc' ? 'desc' : 'asc';
  } else {
    inventorySort.field = field;
    inventorySort.direction = 'desc';
  }

  renderFoodInstanceList();
}

/* -------- MODE CONTROL --------------*/

function toggleMode() {

  // Inventory behavior
  if (currentView === "food-list" || currentView === "storage-list") {
    interactionMode = interactionMode === "browse" ? "select" : "browse";
    document.body.classList.toggle("select-mode", interactionMode === "select");
    clearSelection();
    updateModeButton();
  }

  // Item behavior
  if (currentView === "food-item" || currentView === "storage-item") {
    if (itemMode === "edit" && isDirty) {

      const confirmed = confirm(
        "You have unsaved changes.\n\nPress OK to discard the changes, or Cancel to stay in edit mode."
      );

      if (!confirmed) return;

      // Discard changes
      cancelEdit();
      updateModeButton();
      return;
    }

    itemMode = itemMode === "view" ? "edit" : "view";

    switch (currentView) {
      case "food-item":
        renderFoodInstanceDetail();  // re-render fields
        break;
      case "storage-item":
        renderStorageDetail();  // re-render fields
        break;
    }
    updateModeButton();
  }
}

/* ----------- SELECTING -------------- */

function handleRowClick(event, id) {
  if (interactionMode === "browse") {
    if (currentView === "food-list") {
      showFoodInstance(id);
    } else if (currentView === "storage-list") {
      showStorageLocation(id);
    }
    return;
  }
  // In select mode, selection is controlled in other ways.  
}

function handleRowMouseDown(event, rowEl) {
  if (interactionMode !== "select") return;

  isDragging = true;
  didDrag = false;

  const id = rowEl.dataset.id;

  // Determine drag intent ONCE
  if (selectedItems.has(id)) {
    dragAction = "remove";
    removeItemFromSelection(id, rowEl);
  } else {
    dragAction = "add";
    addItemToSelection(id, rowEl);
  }

  updateSelectionUI();
}


function handleRowMouseOver(event, rowEl) {
  if (interactionMode !== "select" || !isDragging || !dragAction) return;

  didDrag = true;

  const id = rowEl.dataset.id;

  if (dragAction === "add") {
    if (!selectedItems.has(id)) {
      addItemToSelection(id, rowEl);
    }
  }

  if (dragAction === "remove") {
    if (selectedItems.has(id)) {
      removeItemFromSelection(id, rowEl);
    }
  }
  updateSelectionUI();
}

document.addEventListener("mouseup", () => {
  isDragging = false;
  dragAction = null;
  didDrag = false;
});

let touchTimer;


function handleTouchStart(event) {
  if (interactionMode !== "select") {
    return;
  }

  isDragging = true;

  const rowEl = event.currentTarget;
  const id = rowEl.dataset.id;

  // same as mousedown logic
  if (selectedItems.has(id)) {
    dragAction = "remove";
    removeItemFromSelection(id, rowEl);
  } else {
    dragAction = "add";
    addItemToSelection(id, rowEl);
  }

  updateSelectionUI();
}

function handleTouchMove(event) {
  if (interactionMode !== "select" || !isDragging || !dragAction) return;

  // find element under finger
  const touch = event.touches[0];
  const el = document.elementFromPoint(touch.clientX, touch.clientY);

  const rowEl = el?.closest("tr");

  if (!rowEl) return;

  const id = rowEl.dataset.id;
  if (!id) return;

  if (dragAction === "add") {
    if (!selectedItems.has(id)) {
      addItemToSelection(id, rowEl);
    }
  }

  if (dragAction === "remove") {
    if (selectedItems.has(id)) {
      removeItemFromSelection(id, rowEl);
    }
  }
  updateSelectionUI();

  // prevents scrolling while dragging
  event.preventDefault();
}

function handleTouchEnd() {
  isDragging = false;
  dragAction = null;
  clearTimeout(touchTimer);
}

function toggleRowSelection(event, id) {
  if (selectedItems.has(id)) {
    removeItemFromSelection(id);
  } else {
    addItemToSelection(id);
  }

  updateSelectionUI();
}

function addItemToSelection(id, row) {
  row = row || document.getElementById(`row-${id}`);
  if (!row) return;

  selectedItems.add(id);
  row.classList.add("selected-row");
}

function removeItemFromSelection(id, row) {
  row = row || document.getElementById(`row-${id}`);
  if (!row) return;

  selectedItems.delete(id);
  row.classList.remove("selected-row");
}

function clearSelection() {
  selectedItems.clear();

  refreshSelectionUI();
  updateSelectionUI();
}


function refreshSelectionUI() {
  document.querySelectorAll('tr[data-id]').forEach(row => {
    const id = row.dataset.id;
    const isSelected = selectedItems.has(id);

    row.classList.toggle('selected-row', isSelected);
  });
}

function updateSelectionUI() {
  const countEl = document.getElementById('selectionCount');
  if (countEl) {
    countEl.textContent = `${selectedItems.size}`;
  }
}

function updateModeButton() {
  const btn = document.getElementById("modeButton");

  if (currentView === "food-list" || currentView === "storage-list") {
    btn.textContent = interactionMode === "select" ? "✅" : "🔍";
  }

  if (currentView === "food-item" || currentView === "storage-item") {
    btn.textContent = itemMode === "edit" ? "✏️" : "👁️";
  }
}

/* --------- LABELS ----------- */

function openLabelPanel() {
  document.getElementById("labelPanel").classList.remove("hidden");
  renderLabelGrid();
}

function closeLabelPanel() {
  document.getElementById("labelPanel").classList.add("hidden");
}

function renderLabelGrid() {
  const grid = document.getElementById("labelGrid");
  grid.innerHTML = "";

  for (let i = 0; i < 10; i++) {
    const cell = document.createElement("div");
    cell.className = "label-cell";

    if (i < labelStartIndex) {
      cell.classList.add("used");
    }

    if (i === labelStartIndex) {
      cell.classList.add("active");
    }

    cell.textContent = i + 1;

    cell.onclick = () => {
      labelStartIndex = i;
      renderLabelGrid();
    };

    grid.appendChild(cell);
  }
}

function confirmLabelPrint() {
  closeLabelPanel();
  generateLabelsPDF(labelStartIndex);
}

async function generateLabelsPDF(skip=3) {
  const { jsPDF } = window.jspdf;

  const doc = new jsPDF({
    unit: "in",
    format: "letter"
  });

  const items = window._foodInstanceCache.filter(i =>
    selectedItems.has(i.InstanceID)
  );

  if (!items.length) {
    alert("No items selected");
    return;
  }

  const labelsPerPage = 10;
  const labelWidth = 4;
  const labelHeight = 2;

  const marginX = 0.1875;
  const marginY = 0.5;
  const hgap = 0.125;

  let index = skip;

  for (let i = 0; i < items.length; i++) {
    const col = index % 2;
    const row = Math.floor(index % labelsPerPage / 2);

    if (i > 0 && index % labelsPerPage === 0) {
      doc.addPage();
      index = 0;
    }

    const x = marginX + col * (labelWidth+hgap);
    const y = marginY + row * labelHeight;

    await drawLabel(doc, items[i], x, y);

    index++;
  }

  window.open(doc.output("bloburl"));
  // doc.save("labels.pdf");
}

async function drawLabel(doc, item, x, y) {
  const padding = 0.125; // 1/8 inch

  const labelWidth = 4;
  const labelHeight = 2;

  if (labelDrawBoundary) {
    // Draw outer label boundary
    doc.setDrawColor(180);   // light gray for debugging
    doc.setLineWidth(0.01);
    doc.rect(x, y, labelWidth, labelHeight);

    // Draw inner printable area (optional, inset by padding)
    doc.setDrawColor(220);
    doc.rect(
      x + padding,
      y + padding,
      labelWidth - (2 * padding),
      labelHeight - (2 * padding)
    );
  }

  const qrSize = 1.2;

  // QR canvas (temporary)
  const qrTemp = document.createElement("div");
  new QRCode(qrTemp, {
    text: JSON.stringify({ id: item.InstanceID }),
    width: 200,
    height: 200
  });

  const img = qrTemp.querySelector("canvas").toDataURL("image/png");

  // QR LEFT SIDE
  doc.addImage(img,
    "PNG",
    x + padding,
    y + padding,
    qrSize,
    qrSize
  );

  // ID and Date under QR and centered
  doc.setFontSize(12);

  // ID
  let dims = doc.getTextDimensions(item.InstanceID);
  let textY = y + padding + qrSize + dims.h + 0.1;
  doc.text(
    item.InstanceID,
    x + padding + (qrSize - dims.w)/2,
    textY
  );

  // Date
  dims = doc.getTextDimensions(item.Date);
  textY += dims.h + 0.05;
  doc.text(
    item.Date,
    x + padding + (qrSize - dims.w)/2,
    textY
  );


  // RIGHT SIDE TEXT
  const textX = x + 1.5;
  textY = y + padding;

  // Helper for clipped text
  function drawClipped(text, maxWidth, maxLines = 2) {
    const lines = doc.splitTextToSize(text || "", maxWidth).slice(0, maxLines);

    lines.forEach(line => {
      // Use actual text height for spacing
      const dims = doc.getTextDimensions(line);
      doc.text(line, textX, textY + dims.h);

      textY += dims.h + 0.05; // small padding between lines
    });

    // Add a little extra spacing between sections (Label / Date / Notes)
    textY += 0.05;
  }

  // LABEL (bold + larger)
  doc.setFont(undefined, "bold");
  doc.setFontSize(14);
  drawClipped(item.Label, 2.3);

  // KEYWORDS and NOTES (smaller)
  doc.setFont(undefined, "normal");
  doc.setFontSize(12);
  if (item.Keywords) {
    drawClipped(item.Keywords, 2.3);
  }
  if (item.Notes) {
    drawClipped(item.Notes, 2.3);
  }
}

/* ------- UTILITIES --------- */
function parseDate(value) {
  if (!value) return 0;

  // MM/DD/YYYY
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(value)) {
    const [mm, dd, yyyy] = value.split('/');
    return new Date(`${yyyy}-${mm}-${dd}`).getTime();
  }

  // MM/YYYY
  if (/^\d{1,2}\/\d{4}$/.test(value)) {
    const [mm, yyyy] = value.split('/');
    return new Date(`${yyyy}-${mm}-01`).getTime();  // use start of month
  }

  // ❗ fallback (shouldn’t really hit now)
  const d = new Date(value);
  return isNaN(d) ? 0 : d.getTime();
}
