<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="btm-inventory.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Inventory">

  <!-- Google OAuth -->
  <script src="https://accounts.google.com/gsi/client"></script>

  <!-- QR scanner + generator -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body { font-family: sans-serif; padding: 1rem; }
    #cameraButton {
      position: fixed;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
    }
    .card { margin-bottom: 1rem; }
  </style>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</head>

<body>

  <h1 id="app-title">Inventory</h1>

  <button id="settingsButton" class="top-button" title="Settings" onclick="openSettings()">⚙️</button>
  <button id="cameraButton" class="top-button" title="QR reader" onclick="startScanner()">📷</button>
  <button id="labelButton" class="top-button" title="Labels" onclick="openLabelPanel()">🏷️</button>
  <div class="mode-wrapper">
    <button id="modeButton" class="top-button" title="Mode" onclick="toggleMode()">🔍</button>
    <div id="selectionCount"></div>
  </div>

  <div class="nav-tabs-bar">
    <div id="tab-list" class="nav-tab active">
      <button id="tab-list-btn" onclick="handleListTabClick()">List</button>
      <select id="listEntitySelector" onchange="handleEntityChange(this.value)">
        <option value="food">Food Items</option>
        <option value="storage">Storage</option>
        <option value="product">Products</option>
        <option value="event">Events</option>
      </select>
    </div>
    <div id="tab-item" class="nav-tab hidden">
      <button id="tab-item-btn" onclick="handleItemTabClick()"></button>
      <button class="tab-close" onclick="closeItemTab()">&#215;</button>
    </div>
  </div>

  <div style="margin: 1rem;">
    <input id="barcodeInput" placeholder="Scan or enter barcode" />
    <button onclick="handleScanInput()">Scan</button>
  </div>

  <div id="status" class="card">
    <div id="status-controls"></div>
    <div id="status-controls-chips"></div>
    <div id="filteredCount" class="filtered-count"></div>
    <div id="status-message"></div>
  </div>

  <div id="content"></div>

  <div id="scanner-panel" style="display:none;">
    <div class="scanner-video-wrapper">
      <div id="qr-reader"></div>
      <canvas id="scanner-overlay"></canvas>
    </div>
    <div id="scanner-status"></div>
    <button onclick="handleScannerClose()">Close Scanner</button>
  </div>

  <div id="labelPanel" class="label-panel hidden">

    <div class="label-panel-content">

      <h3>Print Labels</h3>

      <!-- Format -->
      <label>Label Format</label>
      <select id="labelFormat">
        <option value="2x4-10">2" x 4" (10 per page)</option>
      </select>

      <!-- Layout picker -->
      <label>Start Position</label>
      <div id="labelGrid" class="label-grid"></div>

      <!-- Buttons -->
      <div class="label-actions">
        <button onclick="confirmLabelPrint()">Create PDF</button>
        <button onclick="closeLabelPanel()">Cancel</button>
      </div>

    </div>
  </div>

  <div id="settingsPanel" class="settings-panel hidden">
    <div class="settings-content">

      <h3>Settings ⚙️</h3>

      <label>Google Sheet ID</label>
      <input id="settings-sheetId" placeholder="Paste Sheet URL or ID" />

      <div class="settings-actions">
        <button onclick="saveSettings()">Save</button>
        <button onclick="closeSettings()">Cancel</button>
      </div>

    </div>
  </div>

  <div id="eventModal" class="settings-panel hidden">
    <div class="settings-content">
      <h3 id="eventModalTitle">New Event</h3>

      <label>Quantity</label>
      <input id="eventQuantity" type="number" />

      <label>Notes</label>
      <input id="eventNotes" />

      <div class="settings-actions">
        <button onclick="confirmEvent()">Save</button>
        <button onclick="closeEventModal()">Cancel</button>
      </div>
    </div>
  </div>

  <div id="assignOverlay" style="display:none;" class="modal-overlay">
    <div class="modal-box">
      <div id="assignOverlayMessage" class="modal-message"></div>
      <div class="modal-actions">
        <button id="assignConfirmBtn">Confirm</button>
        <button id="assignCancelBtn">Cancel</button>
      </div>
    </div>
  </div>

<script src="js/state.js?v=6.1.26"></script>
<script src="js/api.js?v=6.1.26"></script>
<script src="js/foodInstance.js?v=6.1.26"></script>
<script src="js/storageLocation.js?v=6.1.26"></script>
<script src="js/filters.js?v=6.1.26"></script>
<script src="js/render.js?v=6.1.26"></script>
<script src="js/scanner.js?v=6.1.26"></script>
<script src="js/labels.js?v=6.1.26"></script>
<script src="js/config.js?v=6.1.26"></script>
<script src="js/app.js?v=6.1.26"></script>

</body>
</html>
